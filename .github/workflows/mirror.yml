# C164/C175 pull mirror (public repo, assets only). Runs NO code from the private repos: it reads the signed release index,
# verifies it with the pinned release keys (keys/release-keys.json), copies each file the index places on this host from the
# private source release (read-only secret TB_PRIVATE_READ_TOKEN), checks the bytes against the signed sha256 + sha512, and
# publishes it here; it also copies index.json + index.jws to the release `registry` (second index base for the installer).
# A published file is never replaced: different bytes = ALARM (the run fails). Only node: built-ins, no dependency install.
name: mirror
on:
  schedule:
    - cron: "7,22,37,52 * * * *" # after the platform registry-sync (*/15); GitHub may delay scheduled runs
  workflow_dispatch: {}
  repository_dispatch:
    types: [registry-synced] # optional trigger; nothing sends it today (no private-side write access, C164)
permissions: {}
concurrency:
  group: mirror
  cancel-in-progress: false
jobs:
  mirror:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create releases + upload assets in THIS repo only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.11.1"
      - name: mirror
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TB_PRIVATE_READ_TOKEN: ${{ secrets.TB_PRIVATE_READ_TOKEN }}
        run: node scripts/mirror.ts
